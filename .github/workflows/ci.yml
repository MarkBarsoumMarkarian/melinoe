name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install bubblewrap and R survival
        run: sudo apt-get update && sudo apt-get install -y bubblewrap r-base r-cran-survival
      - name: Verify release
        # GitHub-hosted runners block bubblewrap from configuring loopback in a
        # new network namespace. The command contract is still tested here; the
        # live containment probe remains mandatory in the local release gate.
        env:
          MELINOE_SKIP_SANDBOX_INTEGRATION: "1"
        run: ./scripts/verify.sh
